<!DOCTYPE html>
<html>
<head>
    <title>API Integration</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        button {
            padding: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>

<h1>API Data Fetch</h1>

<button onclick="getData()">Get Users</button>

<div id="data"></div>

<script>
function getData() {

    fetch('https://jsonplaceholder.typicode.com/users')
    .then(response => response.json())
    .then(users => {

        let output = "";

        users.forEach(user => {
            output += "<p>" + user.name + "</p>";
        });

        document.getElementById("data").innerHTML = output;
    });
}
</script>

</body>
</html>
